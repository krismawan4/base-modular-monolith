[workspace]
members = [
    "app",
    "modules/auth",
    "modules/users",
]
default-members = ["app"]
resolver = "2"

[workspace.dependencies]
tokio         = { version = "1", features = ["full"] }
async-trait   = "0.1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
uuid          = { version = "1", features = ["v4"] }
axum          = { version = "0.7", features = ["json"] }
sqlx          = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "macros", "chrono"] }
jsonwebtoken  = "9.3"
bcrypt        = "0.15"
chrono        = { version = "0.4", features = ["serde"] }
redis         = { version = "0.28", default-features = false, features = ["tokio-comp", "connection-manager"] }
sha2          = "0.10"
async-graphql = "7.2"
tonic         = "0.12"
prost         = "0.13"
tonic-build   = "0.12"
dotenvy       = "0.15"
