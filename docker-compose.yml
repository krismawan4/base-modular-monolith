services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: modular_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: modular_monolith
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgreSQL:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modular_monolith"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Redis Cache / Token Blacklist ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: modular_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # ── Rust Backend (Axum) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: modular_backend
    restart: unless-stopped
    environment:
      RUST_LOG: "info,tower_http=info"
      LOG_FORMAT: "json"
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: postgres://postgres:password@postgres:5432/modular_monolith
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGIN: "http://localhost:5173"
      # Aktifkan jika memisahkan Users ke container microservice terpisah:
      # USERS_GRPC_URL: http://users_service:8001
    ports:
      - "8000:8000"   # HTTP REST & GraphQL (Axum)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Users Microservice (Opsional — Aktifkan jika split microservice) ───
  # users_service:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.backend
  #   container_name: modular_users_service
  #   command: ["./users_service"]
  #   restart: unless-stopped
  #   environment:
  #     HOST: "0.0.0.0"
  #     PORT: "8001"
  #     DATABASE_URL: postgres://postgres:password@postgres:5432/modular_monolith
  #   ports:
  #     - "8001:8001"   # gRPC Port
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - app_network
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.00"
  #         memory: 512M
  #       reservations:
  #         cpus: "0.20"
  #         memory: 128M


  # ── Frontend (Astro → Nginx) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: modular_frontend
    restart: unless-stopped
    ports:
      - "5173:80"       # Web (http://localhost:5173)
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # ── Grafana Loki (Log Aggregation Engine) ────────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: modular_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - ./docker/loki/data:/loki
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Grafana Alloy (Collector & Scraper) ──────────────────────
  alloy:
    image: grafana/alloy:v1.3.1
    container_name: modular_alloy
    restart: unless-stopped
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"   # Alloy Debug UI
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/alloy/data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # ── Grafana (Visualization & Dashboards) ─────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: modular_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"     # Grafana UI (http://localhost:3000)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  app_network:
    driver: bridge
