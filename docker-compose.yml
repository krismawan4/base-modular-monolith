services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: modular_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: modular_monolith
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgreSQL:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modular_monolith"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache / Token Blacklist ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: modular_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Rust Backend (Axum) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: modular_backend
    restart: unless-stopped
    environment:
      RUST_LOG: info
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: postgres://postgres:password@postgres:5432/modular_monolith
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGIN: "http://localhost"
      # Aktifkan jika memisahkan Users ke container microservice terpisah:
      # USERS_GRPC_URL: http://users_service:8001
    ports:
      - "8000:8000"   # HTTP REST & GraphQL (Axum)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Users Microservice (Opsional — Aktifkan jika split microservice) ───
  # users_service:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.backend
  #   container_name: modular_users_service
  #   command: ["./users_service"]
  #   restart: unless-stopped
  #   environment:
  #     HOST: "0.0.0.0"
  #     PORT: "8001"
  #     DATABASE_URL: postgres://postgres:password@postgres:5432/modular_monolith
  #   ports:
  #     - "8001:8001"   # gRPC Port
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - app_network


  # ── Frontend (Astro → Nginx) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: modular_frontend
    restart: unless-stopped
    ports:
      - "80:80"       # Web
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
