log_format json_analytics escape=json
  '{"timestamp":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"x_request_id":"$request_id",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"duration_ms":$request_time,'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log json_analytics;

    # Mencegah Nginx me-redirect host port ke port 80 internal
    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Astro static site — fallback ke index.html untuk client-side routing
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Proxy API & GraphQL calls ke backend Rust
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    location /graphql {
        proxy_pass         http://backend:8000/graphql;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
}

