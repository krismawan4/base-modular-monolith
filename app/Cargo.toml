[package]
name    = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
auth      = { path = "../components/auth" }
tokio     = { workspace = true }
axum      = { workspace = true }
tower     = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
